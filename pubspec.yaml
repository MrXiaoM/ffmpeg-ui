name: ffmpeg_ui
description: "Desktop media format converter powered by ffmpeg"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  window_manager: ^0.5.2
  flutter_riverpod: ^3.3.2
  file_picker: ^11.0.3
  desktop_drop: ^0.8.4
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  package_info_plus: ^9.0.1
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
    - assets/icons/app_icon.svg
