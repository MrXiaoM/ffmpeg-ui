name: Build

on:
  workflow_call:
    inputs:
      run-checks:
        description: 构建前是否运行 flutter analyze 与 flutter test
        type: boolean
        required: false
        default: true
      upload-release:
        description: 是否将产物上传到 GitHub Release
        type: boolean
        required: false
        default: false
      release-tag:
        description: 要上传附件的 Release tag（upload-release 为 true 时必填）
        type: string
        required: false
        default: ''

jobs:
  checks:
    name: Analyze and test
    if: ${{ inputs.run-checks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  build:
    name: ${{ matrix.artifact }}
    needs: checks
    if: ${{ !cancelled() && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.experimental }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            artifact: ffmpeg_ui-windows-x64
            ext: zip
            source_path: build/windows/x64/runner/Release
            experimental: false
          - os: windows-11-arm
            platform: windows
            arch: arm64
            artifact: ffmpeg_ui-windows-arm64
            ext: zip
            source_path: build/windows/arm64/runner/Release
            experimental: true
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            artifact: ffmpeg_ui-linux-x64
            ext: tar.gz
            source_path: build/linux/x64/release/bundle
            experimental: false
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact: ffmpeg_ui-linux-arm64
            ext: tar.gz
            source_path: build/linux/arm64/release/bundle
            experimental: true
          - os: macos-latest
            platform: macos
            arch: universal
            artifact: ffmpeg_ui-macos-universal
            ext: zip
            source_path: 'build/macos/Build/Products/Release/Media Format Converter.app'
            experimental: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            libayatana-appindicator3-dev

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Build
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            windows)
              flutter build windows --release
              ;;
            linux)
              flutter build linux --release --target-platform "linux-${ARCH}"
              ;;
            macos)
              flutter build macos --release
              app="build/macos/Build/Products/Release/Media Format Converter.app"
              bin="$app/Contents/MacOS/Media Format Converter"
              echo "Architectures after flutter build: $(lipo -archs "$bin")"
              if ! lipo -archs "$bin" | grep -q 'arm64' || ! lipo -archs "$bin" | grep -q 'x86_64'; then
                echo "Not universal, rebuilding with arm64 and x86_64..."
                flutter build macos --config-only --release
                xcodebuild \
                  -workspace macos/Runner.xcworkspace \
                  -scheme Runner \
                  -configuration Release \
                  -destination 'generic/platform=macOS' \
                  ARCHS='arm64 x86_64' \
                  ONLY_ACTIVE_ARCH=NO \
                  CODE_SIGN_IDENTITY='' \
                  CODE_SIGNING_ALLOWED=NO \
                  CODE_SIGNING_REQUIRED=NO
              fi
              echo "Final architectures: $(lipo -archs "$bin")"
              ;;
            *)
              echo "Unsupported platform: $PLATFORM"
              exit 1
              ;;
          esac

      - name: Package
        env:
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT: ${{ matrix.artifact }}
          EXT: ${{ matrix.ext }}
          SOURCE_PATH: ${{ matrix.source_path }}
        run: |
          set -euo pipefail
          if [ ! -e "$SOURCE_PATH" ]; then
            echo "Build output not found: $SOURCE_PATH"
            exit 1
          fi
          mkdir -p dist
          case "$PLATFORM" in
            windows)
              tar.exe -a -cf "dist/${ARTIFACT}.zip" -C "$SOURCE_PATH" .
              ;;
            linux)
              mkdir -p "dist/staging/${ARTIFACT}"
              cp -a "${SOURCE_PATH}/." "dist/staging/${ARTIFACT}/"
              tar -czf "dist/${ARTIFACT}.tar.gz" -C dist/staging "$ARTIFACT"
              ;;
            macos)
              ditto -c -k --keepParent "$SOURCE_PATH" "dist/${ARTIFACT}.zip"
              ;;
            *)
              echo "Unsupported platform: $PLATFORM"
              exit 1
              ;;
          esac
          ls -lh "dist/${ARTIFACT}.${EXT}"

      - name: Package Windows x64 ffmpeg bundle
        if: ${{ success() && inputs.upload-release && matrix.platform == 'windows' && matrix.arch == 'x64' }}
        env:
          SOURCE_PATH: ${{ matrix.source_path }}
        run: |
          set -euo pipefail
          bundle="dist/ffmpeg_ui-bundle-windows-x64.zip"
          staging="dist/bundle-staging"
          extract="dist/ffmpeg-extract"
          archive="dist/ffmpeg-release-essentials.7z"

          rm -rf "$staging" "$extract" "$bundle"
          mkdir -p "$staging" "$extract"
          cp -a "${SOURCE_PATH}/." "$staging/"

          curl.exe -L --retry 5 --retry-all-errors --fail \
            -o "$archive" \
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.7z"

          if [ -x "/c/Program Files/7-Zip/7z.exe" ]; then
            sevenz="/c/Program Files/7-Zip/7z.exe"
          elif command -v 7z >/dev/null 2>&1; then
            sevenz=7z
          else
            echo "7-Zip is required to extract ffmpeg-release-essentials.7z"
            exit 1
          fi

          "$sevenz" x "$archive" "-o${extract}" -y

          ffmpeg_exe="$(find "$extract" -type f -name 'ffmpeg.exe' | head -n 1)"
          if [ -z "$ffmpeg_exe" ]; then
            echo "ffmpeg.exe not found in gyan.dev archive"
            find "$extract" | head
            exit 1
          fi

          ffmpeg_bin="$(dirname "$ffmpeg_exe")"
          mkdir -p "$staging/ffmpeg"
          if [ "$(basename "$ffmpeg_bin")" = "bin" ]; then
            cp -a "$(dirname "$ffmpeg_bin")/." "$staging/ffmpeg/"
          else
            cp -a "${ffmpeg_bin}/." "$staging/ffmpeg/"
          fi

          if [ ! -f "$staging/ffmpeg/bin/ffmpeg.exe" ] && [ ! -f "$staging/ffmpeg/ffmpeg.exe" ]; then
            echo "Bundled ffmpeg layout is unexpected"
            find "$staging/ffmpeg" | head
            exit 1
          fi

          tar.exe -a -cf "$bundle" -C "$staging" .
          ls -lh "$bundle"

      - name: Upload artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.${{ matrix.ext }}
          if-no-files-found: error

      - name: Upload ffmpeg bundle artifact
        if: ${{ success() && inputs.upload-release && matrix.platform == 'windows' && matrix.arch == 'x64' }}
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg_ui-bundle-windows-x64
          path: dist/ffmpeg_ui-bundle-windows-x64.zip
          if-no-files-found: error

      - name: Prepare release assets
        if: ${{ success() && inputs.upload-release }}
        env:
          TAG: ${{ inputs.release-tag }}
          ARTIFACT: ${{ matrix.artifact }}
          EXT: ${{ matrix.ext }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "release-tag is required when upload-release is true"
            exit 1
          fi
          version="${TAG#v}"
          mkdir -p dist/release-assets
          cp "dist/${ARTIFACT}.${EXT}" \
            "dist/release-assets/ffmpeg_ui-${version}-${ARTIFACT#ffmpeg_ui-}.${EXT}"
          if [ "$PLATFORM" = "windows" ] && [ "$ARCH" = "x64" ]; then
            cp dist/ffmpeg_ui-bundle-windows-x64.zip dist/release-assets/
          fi

      - name: Upload to GitHub Release
        if: ${{ success() && inputs.upload-release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release-tag }}
          files: dist/release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
